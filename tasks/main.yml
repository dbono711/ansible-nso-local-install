- name: main | Gather operating system variables
  ansible.builtin.include_vars: "{{ item }}"
  with_first_found:
    - "{{ ansible_facts['distribution'] | lower }}-{{ ansible_facts['distribution_major_version'] }}.yml"
    - "{{ ansible_facts['distribution'] | lower }}.yml"
    - "{{ ansible_facts['os_family'] | lower }}.yml"
  tags: [always]

- name: main | Pre-flight
  ansible.builtin.import_tasks: pre-flight.yml
  tags: [always]

- name: main | Install
  ansible.builtin.import_tasks: install.yml
  tags: [install, runtime]

- name: main | Runtime
  ansible.builtin.import_tasks: runtime.yml
  tags: [runtime]

- name: main | NED packages
  ansible.builtin.import_tasks: neds.yml
  when: nso_ned_packages | default([]) | length > 0
  tags: [nso_neds]

- name: main | Flush handlers
  ansible.builtin.meta: flush_handlers
  tags: [always]

- name: main | NETSIM devices
  ansible.builtin.import_tasks: netsim.yml
  when:
    - nso_netsim | default([]) | length > 0
    - nso_ned_packages | default([]) | length > 0
  tags: [nso_netsim]

- name: main | Cleanup
  ansible.builtin.import_tasks: cleanup.yml
  tags: [always]
