---
- name: netsim | Assert that defined NETSIM types are supported
  ansible.builtin.assert:
    that:
      - item.type == 'iosxr' or item.type == 'ios' or item.type == 'nxos'
    fail_msg: "Whoops! A NETSIM for '{{ item.type }}' is not supported"
    quiet: true
  loop: "{{ nso_netsim }}"

- name: netsim | Register NED packages from NSO runtime
  ansible.builtin.find:
    paths: "{{ nso_runtime_dir }}/packages"
    file_type: directory
  register: nso_ned_dir

- name: netsim | Register NED NETSIM folders
  ansible.builtin.stat:
    path: "{{ item.path }}/netsim"
  register: nso_ned_netsim_dir
  loop: "{{ nso_ned_dir.files }}"

- name: netsim | Map device types to NED packages
  ansible.builtin.set_fact:
    nso_netsim_neds: >-
      {{ nso_netsim_neds | default({}) | combine({
           item.type: nso_ned_dir.files | map(attribute='path')
                      | select('search', '/' ~ nso_netsim_ned_prefix[item.type])
                      | first | default('')
         }) }}
  loop: "{{ nso_netsim }}"
  loop_control:
    label: "{{ item.type }}"

- name: netsim | Assert a NED exists for every NETSIM type
  ansible.builtin.assert:
    that: nso_netsim_neds[item.type] | length > 0
    fail_msg: "No NED package found for NETSIM type '{{ item.type }}'"
    quiet: true
  loop: "{{ nso_netsim }}"
  loop_control:
    label: "{{ item.type }}"

- name: netsim | Create NETSIM directory
  ansible.builtin.file:
    path: "{{ nso_netsim_dir }}"
    state: directory
    mode: "0755"

- name: netsim | Create NETSIM setup script
  ansible.builtin.template:
    src: "netsim-env-setup-local.sh.j2"
    dest: "/tmp/netsim-env-setup-local.sh"
    mode: "0755"

